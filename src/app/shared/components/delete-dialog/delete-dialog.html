<div class="modal-overlay" (click)="onCancel()">
  <div class="modal-dialog" (click)="$event.stopPropagation()">
    <div class="modal-header">
      <h2 class="modal-title">Delete Account</h2>
      <button class="modal-close-btn" aria-label="Close dialog" (click)="onCancel()">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M18 6L6 18M6 6l12 12" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </button>
    </div>
    <div class="modal-body">
      <div class="alert-icon-wrapper">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </div>
      <div class="modal-alert-content">
        <p class="alert-message">Are you sure you want to delete this user?</p>
        <p class="alert-submessage">This action is permanent and cannot be undone. All database records, permissions, and session logs for this user will be removed.</p>
      </div>
    </div>
    <div class="modal-footer">
      <button class="btn btn-secondary-modal" (click)="onCancel()">Cancel</button>
      <button class="btn btn-danger-modal" (click)="onConfirm()">Confirm Delete</button>
    </div>
  </div>
</div>
