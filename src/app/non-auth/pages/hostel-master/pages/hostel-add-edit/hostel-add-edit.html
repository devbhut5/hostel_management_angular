<div class="user-list-container">
  <!-- Page Header -->
  <div class="page-header">
    <div class="header-titles">
      <h1 class="page-title">Add/Edit Hostel</h1>
      <p class="page-subtitle">Configure basic details, locations, capacities and wardens.</p>
    </div>
    <button class="btn btn-reset" [routerLink]="['/hostel']">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <line x1="19" y1="12" x2="5" y2="12"></line>
        <polyline points="12 19 5 12 12 5"></polyline>
      </svg>
      Back to List
    </button>
  </div>

  <!-- Form Wrapper -->
  <div class="form-card">
    <form class="form-grid">
      <!-- Section 1: Basic Information -->
      <div class="form-section">
        <h3 class="form-section-title">Basic Information</h3>
        
        <div class="form-group">
          <label class="form-label">Hostel Name <span class="required-star">*</span></label>
          <input type="text" class="form-control" placeholder="Enter hostel name" required />
        </div>

        <div class="form-group">
          <label class="form-label">Hostel Code <span class="required-star">*</span></label>
          <input type="text" class="form-control" placeholder="Enter hostel code (e.g. BH-01)" required />
        </div>

        <div class="form-group">
          <label class="form-label">Hostel Type</label>
          <div class="form-select-wrapper">
            <select class="form-control">
              <option value="Boys">Boys</option>
              <option value="Girls">Girls</option>
              <option value="Both">Both (Co-Ed)</option>
            </select>
          </div>
        </div>

        <div class="form-group">
          <label class="form-label">Total Floors</label>
          <input type="number" class="form-control" placeholder="Enter total floors" min="1" />
        </div>

        <div class="form-group">
          <label class="form-label">Total Rooms</label>
          <input type="number" class="form-control" placeholder="Enter total rooms" min="1" />
        </div>

        <div class="form-group">
          <label class="form-label">Total Capacity (Beds)</label>
          <input type="number" class="form-control" placeholder="Enter total capacity" min="1" />
        </div>
      </div>

      <!-- Section 2: Contact Information -->
      <div class="form-section">
        <h3 class="form-section-title">Contact Information</h3>

        <div class="form-group">
          <label class="form-label">Address</label>
          <input type="text" class="form-control" placeholder="Enter address details" />
        </div>

        <div class="form-group">
          <label class="form-label">City</label>
          <input type="text" class="form-control" placeholder="Enter city" />
        </div>

        <div class="form-group">
          <label class="form-label">State</label>
          <input type="text" class="form-control" placeholder="Enter state" />
        </div>

        <div class="form-group">
          <label class="form-label">Pincode</label>
          <input type="text" class="form-control" placeholder="Enter 6-digit pincode" maxlength="6" />
        </div>

        <div class="form-group">
          <label class="form-label">Mobile Number</label>
          <input type="text" class="form-control" placeholder="Enter mobile number" />
        </div>

        <div class="form-group">
          <label class="form-label">Email</label>
          <input type="email" class="form-control" placeholder="Enter email address" />
        </div>
      </div>

      <!-- Section 3: Warden Details -->
      <div class="form-section">
        <h3 class="form-section-title">Warden Details</h3>

        <div class="form-group">
          <label class="form-label">Warden Name</label>
          <input type="text" class="form-control" placeholder="Enter warden name" />
        </div>

        <div class="form-group">
          <label class="form-label">Warden Mobile</label>
          <input type="text" class="form-control" placeholder="Enter warden mobile number" />
        </div>
      </div>

      <!-- Section 4: Other Information -->
      <div class="form-section">
        <h3 class="form-section-title">Other Information</h3>

        <div class="form-group">
          <label class="form-label">Description</label>
          <textarea class="form-control" rows="3" placeholder="Enter brief description about the hostel" style="resize: vertical;"></textarea>
        </div>

        <div class="form-group">
          <label class="form-label">Status</label>
          <div class="form-select-wrapper">
            <select class="form-control">
              <option value="Active">Active</option>
              <option value="Inactive">Inactive</option>
            </select>
          </div>
        </div>
      </div>

      <!-- Form Actions -->
      <div class="form-actions">
        <button type="submit" class="btn btn-primary">Save Hostel</button>
        <button type="button" class="btn btn-reset" [routerLink]="['/hostel']">Cancel</button>
      </div>
    </form>
  </div>
</div>
